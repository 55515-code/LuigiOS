name: Bug report
description: Report a reproducible OS, COSMIC, developer-tool, or network problem.
title: "[Bug]: "
labels: [bug, needs-triage]
body:
  - type: markdown
    attributes:
      value: Never attach credentials, private keys, tokens, proprietary source, or unredacted logs.
  - type: input
    id: image
    attributes:
      label: Image version or source commit
    validations:
      required: true
  - type: input
    id: hardware
    attributes:
      label: CPU, GPU, and network adapter
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: dropdown
    id: peer
    attributes:
      label: Decentralized peer mode
      options: [Disabled, Enabled without public DHT, Enabled with public DHT, Not relevant]
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Redacted diagnostics
