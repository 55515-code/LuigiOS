name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - name: Check contribution sign-offs
        if: github.event_name == 'pull_request'
        run: ./tools/check-dco "${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Validate product and reproducibility contracts
        run: ./tools/ci-check
      - name: Record dependency-lock digest
        run: sha256sum sdk/package-lock.json > package-lock.sha256
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: dependency-lock-${{ github.sha }}
          path: package-lock.sha256
          retention-days: 30
