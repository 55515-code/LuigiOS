name: Draft source release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  source-release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Require matching version and validate source
        run: |
          test "${GITHUB_REF_NAME}" = "v$(cat VERSION)"
          ./tools/ci-check
      - name: Build reproducible contributor source archive
        run: ./tools/release-source
      - name: Add dependency lock and digest
        run: |
          cp sdk/package-lock.json "dist/luigios-$(cat VERSION).package-lock.json"
          sha256sum "dist/luigios-$(cat VERSION).package-lock.json" \
            > "dist/luigios-$(cat VERSION).package-lock.json.sha256"
      - name: Create human-gated draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --verify-tag \
            --draft \
            --generate-notes \
            --title "LuigiOS ${GITHUB_REF_NAME}" \
            dist/*
