---
# LuigiOS bootloader configuration for Calamares
# Explicitly configures the bootloader module for Limine with LuigiOS branding

bootloader: limine
efiBootloaderId: "luigios"
installPath: /boot

# Limine-specific settings
timeout: 3
remember_last_entry: true

# Kernel parameters (will be combined with root=UUID by Calamares)
kernelParams: "quiet splash"

# Branding
limineSplashLogo: "/usr/share/luigios/branding/assets/boot/boot-logo-1280x800.png"
