---
modules-search: [ local ]

instances:
  - id: modify_mk_hook
    module: shellprocess
    config: shellprocess_modify_mk_hook.conf
  - id: reset_mk_hook
    module: shellprocess
    config: shellprocess_reset_mk_hook.conf
  - id: initialize_pacman
    module: shellprocess
    config: shellprocess_initialize_pacman.conf
  - id: enable_ufw
    module: shellprocess
    config: shellprocess_enable_ufw.conf
  - id: btrfs_snapshot
    module: shellprocess
    config: shellprocess_btrfs_snapshot.conf
  - id: luigios
    module: shellprocess
    config: shellprocess_luigios.conf
  - id: cleanup_calamares
    module: shellprocess
    config: shellprocess_cleanup_calamares.conf

sequence:
  - show:
      - welcome
      - locale
      - keyboard
      - partition
      - users
      - summary
  - exec:
      - partition
      - mount
      - shellprocess@modify_mk_hook
      - shellprocess@initialize_pacman
      - pacstrap
      - machineid
      - users
      - locale
      - keyboard
      - localecfg
      - luksbootkeyfile
      - luksopenswaphookcfg
      - fstab
      - plymouthcfg
      - initcpiocfg
      - initcpio
      - networkcfg
      - displaymanager
      - hwclock
      - bootloader
      - shellprocess@reset_mk_hook
      - services-systemd
      - shellprocess@luigios
      - shellprocess@enable_ufw
      - shellprocess@btrfs_snapshot
      - shellprocess@cleanup_calamares
      - umount
  - show:
      - finished

branding: luigios
prompt-install: true
dont-chroot: false
oem-setup: false
disable-cancel-during-exec: false
hide-back-and-next-during-exec: true
quit-at-end: false
