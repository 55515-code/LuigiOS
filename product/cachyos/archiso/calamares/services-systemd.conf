---
units:
  - { name: "NetworkManager.service", action: "enable", mandatory: true }
  - { name: "ananicy-cpp.service", action: "enable", mandatory: false }
  - { name: "avahi-daemon.service", action: "enable", mandatory: false }
  - { name: "bluetooth.service", action: "enable", mandatory: false }
  - { name: "cosmic-greeter.service", action: "enable", mandatory: true }
  - { name: "fstrim.timer", action: "enable", mandatory: false }
  - { name: "paccache.timer", action: "enable", mandatory: false }
  - { name: "snapper-cleanup.timer", action: "enable", mandatory: false }
  - { name: "systemd-resolved.service", action: "enable", mandatory: false }
  - { name: "ufw.service", action: "enable", mandatory: false }
  - { name: "sshd.service", action: "disable", mandatory: false }
  - { name: "luigios-peer.service", action: "disable", mandatory: false }
